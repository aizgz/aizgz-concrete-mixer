<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <!-- 引入 Decap CMS 官方脚本 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 强制把后端配置改为 GitHub + 你的 Vercel OAuth 接口 -->
  <script>
    window.CMS_MANUAL_INIT = true;
    
    // 强制使用你的 GitHub 后端和 Vercel API 授权接口
    window.initCMS({
      config: {
        backend: {
          name: 'github',
          repo: 'aizgz/aizgz-concrete-mixer',
          branch: 'main',
          base_url: 'https://aizgz.vercel.app',
          auth_endpoint: 'api/auth'
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'products',
            label: 'Concrete Mixers (搅拌机产品)',
            folder: 'content/products',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Product Title (产品名称)', name: 'title', widget: 'string' },
              { label: 'Model Number (型号)', name: 'model', widget: 'string' },
              { label: 'Cover Image (产品主图)', name: 'image', widget: 'image' },
              { label: 'Capacity (出料容量)', name: 'capacity', widget: 'string', required: false },
              { label: 'Power Type (动力)', name: 'power_type', widget: 'select', options: ['Electric Engine', 'Diesel Engine', 'Gasoline Engine'] },
              { label: 'Key Features (主要特点)', name: 'features', widget: 'list', required: false },
              { label: 'Detailed Description (详细介绍)', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
