<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <!-- 加载 Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- 强制劫持 Netlify 登录按钮，变成真正的 GitHub 登录 -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const timer = setInterval(() => {
        // 抓取页面上的登录按钮
        const btn = document.querySelector('button');
        if (btn && (btn.innerText.includes('Netlify') || btn.innerText.includes('Login'))) {
          btn.innerText = "Login with GitHub (Direct)";
          btn.style.backgroundColor = "#24292e";
          btn.style.color = "#ffffff";
          btn.onclick = (e) => {
            e.preventDefault();
            // 直接引导至你的 GitHub 仓库主页进行确认，或者走官方授权
            window.location.href = "https://github.com/login/oauth/authorize?client_id=YOUR_GITHUB_CLIENT_ID&redirect_uri=" + encodeURIComponent(window.location.origin + "/admin/");
          };
          clearInterval(timer);
        }
      }, 300);
    });
  </script>
</body>
</html>
