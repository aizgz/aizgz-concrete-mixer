backend:
  name: github
  repo: aizgz/aizgz-concrete-mixer
  branch: main
  base_url: https://aizgz.vercel.app
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Concrete Mixers (搅拌机产品)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Title", name: "title", widget: "string" }
      - { label: "Model Number", name: "model", widget: "string" }
      - { label: "Cover Image", name: "image", widget: "image" }
