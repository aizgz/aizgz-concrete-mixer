backend:
  name: github
  repo: aizgz/aizgz-concrete-mixer
  branch: main
  base_url: https://www.aizgz.com
  auth_endpoint: /api/auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # 1. 站点全局设置
  - name: "settings"
    label: "Site Settings (站点全局设置)"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings (联系方式与品牌配置)"
        file: "content/settings/general.json"
        fields:
          - { label: "Brand Name (品牌名称)", name: "brand_name", widget: "string", default: "AIZGZ" }
          - { label: "Brand Tagline (品牌标语)", name: "brand_tagline", widget: "string", default: "HEAVY MACHINERY" }
          - { label: "WhatsApp Number (带国家代码, 如 8613800138000)", name: "whatsapp_number", widget: "string", default: "8615037113544" }
          - { label: "Contact Email (联系邮箱)", name: "contact_email", widget: "string", default: "aimr@qq.com" }
          - { label: "Formspree Form ID (询盘表单ID)", name: "formspree_id", widget: "string", default: "" }
          - { label: "Google Analytics ID (谷歌统计ID)", name: "ga_id", widget: "string", default: "" }
          - { label: "YouTube Channel / Video URL (YouTube主页)", name: "youtube_url", widget: "string", default: "" }
          - { label: "Hero Title (首页大标题)", name: "hero_title", widget: "string", default: "Dry Mix Mortar Production Lines & Powder Processing Equipment" }
          - { label: "Hero Subtitle (首页副标题)", name: "hero_subtitle", widget: "text", default: "Source dry mix mortar production lines, powder mixing equipment and valve bagging machines with project-specific configuration support." }
          - { label: "Homepage Hero Image (首页主视觉图片)", name: "hero_image", widget: "image", required: false, hint: "Upload and select the real equipment or production-line photo for the homepage. The original is preserved; responsive WebP versions are generated automatically." }
          - { label: "Homepage Hero Image Alt Text (图片替代文字，可选)", name: "hero_image_alt", widget: "string", required: false, hint: "Describe the actual contents of the selected photo. Leave blank if not confirmed." }
          - { label: "About Us Text (关于我们介绍)", name: "about_text", widget: "text", default: "AIZGZ Machinery is a China-based industrial machinery sourcing and solutions provider for dry-mix mortar production, powder mixing and packaging equipment." }
          - { label: "Homepage SEO Title (首页SEO标题)", name: "seo_title", widget: "string", required: false, hint: "Keep the main search phrase near the beginning; aim for about 50–60 characters." }
          - { label: "Homepage SEO Description (首页SEO描述)", name: "seo_description", widget: "text", required: false, hint: "Write a clear, factual summary of the homepage in about 140–160 characters." }

  # 2. 产品管理（广泛/通用型设备）
  - name: "products"
    label: "Equipment Products (产品管理)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name (产品名称)", name: "title", widget: "string", required: true, hint: "Enter the English product name. Other languages are managed centrally; no need to enter translations here." }
      - { label: "Product URL Slug (产品网址标识)", name: "url_slug", widget: "string", required: true, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase English letters, numbers and single hyphens only."], hint: "Keep this unchanged after publication so the product URL does not change." }
      - { label: "Category (产品分类)", name: "category", widget: "select", required: true, options: ["Dry Mortar Production Systems", "Mixing & Blending Equipment", "Packaging Equipment"] }
      - { label: "Model (型号，如有)", name: "model", widget: "string", required: false }
      - { label: "Short Summary (简短介绍，可选)", name: "summary", widget: "text", required: false, hint: "One or two factual sentences. Leave blank if not ready." }
      - { label: "Main Product Image (产品主图，可后续补充)", name: "image", widget: "image", required: false, hint: "Upload a real matching product photo only. This field can be left blank and completed later." }
      - { label: "Product Description & Technical Details (产品介绍与详细资料)", name: "body", widget: "markdown", required: true, hint: "Paste the supplied product description, features and technical parameter table. Keep source values and confirmation notes; do not guess missing specifications." }
      - label: "Optional Technical Parameters (可选技术参数)"
        name: "specifications"
        widget: "object"
        collapsed: true
        summary: "{{fields.capacity}}"
        fields:
          - { label: "Internal Material Capacity (设备内部物料容量)", name: "internal_capacity", widget: "string", required: false }
          - { label: "Capacity / Throughput (产能)", name: "capacity", widget: "string", required: false }
          - { label: "Batch Quantity (批次容量)", name: "batch_quantity", widget: "string", required: false }
          - { label: "Bagging Rate (包装速度)", name: "bagging_rate", widget: "string", required: false }
          - { label: "Weighing Accuracy (计量精度)", name: "weighing_accuracy", widget: "string", required: false }
          - { label: "Air Pressure (气源压力)", name: "air_pressure", widget: "string", required: false }
          - { label: "Air Consumption (耗气量)", name: "air_consumption", widget: "string", required: false }
          - { label: "Voltage (电压)", name: "voltage", widget: "string", required: false }
          - { label: "Frequency (频率)", name: "frequency", widget: "string", required: false }
          - { label: "Motor Power (电机功率)", name: "motor_power", widget: "string", required: false }
          - { label: "Dimensions (外形尺寸)", name: "dimensions", widget: "string", required: false }
          - { label: "Operating Temperature (工作温度)", name: "operating_temperature", widget: "string", required: false }
          - { label: "Operator Count (操作人员)", name: "operator_count", widget: "string", required: false }
          - { label: "Packaging Range (包装重量范围)", name: "packaging_range", widget: "string", required: false }
          - { label: "Mixing Volume (搅拌容积)", name: "mixing_volume", widget: "string", required: false }
          - { label: "Mixing Time (搅拌时间)", name: "mixing_time", widget: "string", required: false }
          - { label: "Supply Status (供货状态)", name: "supply_status", widget: "select", options: ["Available for Supply", "Sourcing on Request", "Temporarily Unavailable"], required: false }
          - { label: "Power / Control Type (动力/控制方式)", name: "power_type", widget: "select", options: ["Electric Motor", "Automatic PLC System", "Electric Engine", "Diesel Engine", "Semi-Automatic"], required: false }
          - { label: "Application (适用物料/用途)", name: "application", widget: "text", required: false }
          - { label: "Optional Components (可选配置)", name: "optional_components", widget: "text", required: false }

  # 4. 视频展厅管理：平台自动识别，YouTube 封面自动获取
  - name: "videos"
    label: "Video Showroom (视频展厅)"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Video Title (视频标题)"
        name: "title"
        widget: "string"
        hint: "填写简短的英文标题，例如 Equipment Packing & Shipping。"
      - label: "Video URL (视频链接)"
        name: "video_url"
        widget: "string"
        hint: "粘贴 YouTube 视频链接。系统会自动获取视频封面。"
      - label: "Custom Cover Image (自定义封面，可选)"
        name: "image"
        widget: "image"
        required: false
        hint: "通常不需要上传。YouTube 会自动使用视频封面；只有需要替换封面时，才上传图片。"

