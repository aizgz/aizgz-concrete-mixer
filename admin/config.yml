backend:
  name: github
  repo: aizgz/aizgz-concrete-mixer
  branch: main
  base_url: https://www.aizgz.com
  auth_endpoint: /api/auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # 1. 站点全局设置
  - name: "settings"
    label: "Site Settings (站点全局设置)"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings (联系方式与品牌配置)"
        file: "content/settings/general.json"
        fields:
          - { label: "Brand Name (品牌名称)", name: "brand_name", widget: "string", default: "AIZGZ" }
          - { label: "Brand Tagline (品牌标语)", name: "brand_tagline", widget: "string", default: "HEAVY MACHINERY" }
          - { label: "WhatsApp Number (带国家代码, 如 8613800138000)", name: "whatsapp_number", widget: "string", default: "8615037113544" }
          - { label: "Contact Email (联系邮箱)", name: "contact_email", widget: "string", default: "aimr@qq.com" }
          - { label: "Formspree Form ID (询盘表单ID)", name: "formspree_id", widget: "string", default: "" }
          - { label: "Google Analytics ID (谷歌统计ID)", name: "ga_id", widget: "string", default: "" }
          - { label: "YouTube Channel / Video URL (YouTube主页)", name: "youtube_url", widget: "string", default: "" }
          - { label: "TikTok Profile URL (TikTok主页)", name: "tiktok_url", widget: "string", default: "" }
          - { label: "Hero Title (首页大标题)", name: "hero_title", widget: "string", default: "Industrial Equipment for Construction & Material Handling" }
          - { label: "Hero Subtitle (首页副标题)", name: "hero_subtitle", widget: "text", default: "AIZGZ Machinery connects international buyers with equipment suppliers and helps review specifications, availability, quotations, and shipping requirements." }
          - { label: "Homepage Hero Image (首页主视觉图片)", name: "hero_image", widget: "image", required: false, hint: "Upload and select the real equipment or production-line photo for the homepage. The original is preserved; responsive WebP versions are generated automatically." }
          - { label: "Homepage Hero Image Alt Text (图片替代文字，可选)", name: "hero_image_alt", widget: "string", required: false, hint: "Describe the actual contents of the selected photo. Leave blank if not confirmed." }
          - { label: "About Us Text (关于我们介绍)", name: "about_text", widget: "text", default: "AIZGZ Machinery connects international buyers with equipment suppliers for construction, dry-mix materials, mixing, packaging, and material handling." }

  # 2. 产品管理（广泛/通用型设备）
  - name: "products"
    label: "Equipment Products (产品管理)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Title - English (产品英文名称)", name: "title", widget: "string" }
      - { label: "Product URL Slug (稳定产品网址标识)", name: "url_slug", widget: "string", required: true, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Only lowercase English letters, numbers, and single hyphens are allowed."], hint: "Use lowercase English letters, numbers and single hyphens only. Keep unchanged after publication." }
      - { label: "Product Title - Spanish (西班牙语名称)", name: "title_es", widget: "string", required: false }
      - { label: "Product Title - Arabic (阿拉伯语名称)", name: "title_ar", widget: "string", required: false }
      - { label: "Product Title - Russian (俄语名称)", name: "title_ru", widget: "string", required: false }
      - { label: "Model (型号)", name: "model", widget: "string", required: false }
      - { label: "Internal Material Capacity (设备内部物料容量)", name: "internal_capacity", widget: "string", required: false }
      # 👈 核心升级：新增设备分类下拉菜单，涵盖干粉砂浆及重型建机
      - { 
          label: "Category (设备大类)", 
          name: "category", 
          widget: "select", 
          options: [
            "Dry Mix Mortar Plant",
            "Mixing & Blending Equipment", 
            "Tile Adhesive Production Line", 
            "Wall Putty Making Machine", 
            "Concrete Equipment", 
            "Block & Brick Making Machine", 
            "Crushing & Screening Plant", 
            "Packing & Auxiliary Equipment",
            "Palletizers"
          ] 
        }
      - { label: "Capacity / Throughput (产能)", name: "capacity", widget: "string", required: false }
      - { label: "Voltage (电压)", name: "voltage", widget: "string", required: false }
      - { label: "Frequency (频率)", name: "frequency", widget: "string", required: false }
      - { label: "Motor Power (电机功率)", name: "motor_power", widget: "string", required: false }
      - { label: "Packaging Range (包装重量范围)", name: "packaging_range", widget: "string", required: false }
      - { label: "Mixing Volume (搅拌容积/批次容量)", name: "mixing_volume", widget: "string", required: false }
      - { label: "Mixing Time (搅拌时间)", name: "mixing_time", widget: "string", required: false }
      - { label: "Application (适用物料/用途)", name: "application", widget: "text", required: false }
      - { label: "Optional Components (可选配置)", name: "optional_components", widget: "text", required: false }
      - { label: "Supply Status (供货状态)", name: "supply_status", widget: "select", options: ["Available for Supply", "Sourcing on Request", "Temporarily Unavailable"], required: false }
      - { label: "Manufacturer (制造商)", name: "manufacturer", widget: "string", required: false }
      - { label: "Supply Relationship (供应关系)", name: "supply_relationship", widget: "select", options: ["Manufacturer", "Factory Partner", "Authorized Distributor", "Non-exclusive Distributor", "Sourcing Partner", "To Be Confirmed"], required: false }
      - { 
          label: "Power / Control Type (动力/控制方式)", 
          name: "power_type", 
          widget: "select", 
          options: ["Electric Motor", "Automatic PLC System", "Electric Engine", "Diesel Engine", "Semi-Automatic"],
          required: false
        }
      - { label: "Product Image (产品主图)", name: "image", widget: "image" }
      - { label: "Short Summary (简短介绍/摘要)", name: "summary", widget: "text", required: false }
      - { label: "Technical Specifications & Details - English (英文技术参数与说明)", name: "body", widget: "markdown" }
      - { label: "Technical Details - Spanish (西班牙语详细说明)", name: "body_es", widget: "markdown", required: false }
      - { label: "Technical Details - Arabic (阿拉伯语详细说明)", name: "body_ar", widget: "markdown", required: false }
      - { label: "Technical Details - Russian (俄语详细说明)", name: "body_ru", widget: "markdown", required: false }

  # 3. 发货与工程成功案例
  - name: "cases"
    label: "Shipment & Cases (发货与工程案例)"
    folder: "content/cases"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title (案例/发货标题)", name: "title", widget: "string" }
      - { label: "Destination Country (目的国/地区)", name: "country", widget: "string" }
      - { label: "Equipment Shipped (出口设备名称)", name: "equipment", widget: "string", required: false }
      - { label: "Photo (现场/打包发货照片)", name: "image", widget: "image" }
      - { label: "Publish Date (日期)", name: "date", widget: "date" }
      - { label: "Project Brief (项目简述)", name: "body", widget: "markdown", required: false }

  # 4. 视频展厅管理：平台自动识别，YouTube 封面自动获取
  - name: "videos"
    label: "Video Showroom (视频展厅)"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Video Title (视频标题)"
        name: "title"
        widget: "string"
        hint: "填写简短的英文标题，例如 Equipment Packing & Shipping。"
      - label: "Video URL (视频链接)"
        name: "video_url"
        widget: "string"
        hint: "直接粘贴 YouTube 或 TikTok 视频链接。系统会自动识别平台；YouTube 会自动获取封面。"
      - label: "Custom Cover Image (自定义封面，可选)"
        name: "image"
        widget: "image"
        required: false
        hint: "通常不需要上传。YouTube 自动使用视频封面；只有想替换封面，或 TikTok 无法自动获取封面时，才上传图片。"

