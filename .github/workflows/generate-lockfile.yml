name: Generate npm lockfile

on:
  push:
    branches:
      - chore/build-lockfile-ci-docs

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate the npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The npm lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: generate npm dependency lockfile"
          git push
