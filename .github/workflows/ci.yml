name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node.js dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Run inquiry form regression checks
        run: node scripts/test-inquiry-forms.js

      - name: Run content API regression checks
        run: node scripts/test-content-api.js

      - name: Run OAuth regression checks
        run: node scripts/test-oauth.js

      - name: Verify committed Tailwind CSS is up to date
        run: git diff --exit-code -- assets/tailwind.min.css

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run image processing unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
