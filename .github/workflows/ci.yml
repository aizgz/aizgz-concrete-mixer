name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node.js dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Verify committed Tailwind CSS is up to date
        run: git diff --exit-code -- assets/tailwind.min.css

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run image processing unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
