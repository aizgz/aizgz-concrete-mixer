name: Build Tailwind CSS

on:
  push:
    branches:
      - main
      - tailwind-static-css
      - fix-product-grid-layout-shift
    paths:
      - "index.html"
      - "tailwind.config.cjs"
      - "styles/tailwind.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-tailwind-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Tailwind CSS
        run: npm ci

      - name: Generate minified CSS
        run: npm run build:css

      - name: Commit generated CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.min.css
          if git diff --cached --quiet; then
            echo "Generated CSS is already up to date."
            exit 0
          fi
          git commit -m "chore: build static Tailwind CSS"
          git push
