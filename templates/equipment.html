<!DOCTYPE html>
<html lang="{{HTML_LANG}}" dir="{{DIR}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{CANONICAL}}">
  {{ALTERNATES}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AIZGZ Machinery">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta name="theme-color" content="#142b4a">
  <style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1f2937;background:#f9fafb;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;background:#f9fafb}a{color:inherit;text-decoration:none}
.site-header{position:sticky;top:0;z-index:40;background:#0f172a;color:#fff;border-bottom:1px solid #334155;box-shadow:0 4px 14px rgba(15,23,42,.12)}.header-inner,.container{width:min(1280px,calc(100% - 32px));margin:auto}.header-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:22px}.header-navigation{display:flex;align-items:center;justify-content:flex-end;gap:22px;flex-wrap:wrap}.primary-nav{display:flex;align-items:center;gap:18px;font-size:.88rem;font-weight:700;color:#e2e8f0}.primary-nav a{padding:8px 0;border-bottom:2px solid transparent}.primary-nav a:hover,.primary-nav a[aria-current=page]{color:#fbbf24;border-color:#f59e0b}.primary-nav .nav-inquiry{padding:8px 13px;background:#f59e0b;color:#111827;border:0;border-radius:6px}.primary-nav .nav-inquiry:hover{background:#fbbf24;color:#111827}.header-navigation .language-links{gap:12px}
.brand{font-weight:800;letter-spacing:.04em;color:#f59e0b;font-size:1.45rem;white-space:nowrap}.brand span{font-size:.68rem;letter-spacing:.16em;color:#e2e8f0;margin-left:.45rem}.language-links{display:flex;gap:1rem;flex-wrap:wrap;font-size:.84rem;color:#cbd5e1}.language-links a{padding:7px 0;border-bottom:2px solid transparent}.language-links a:hover,.language-links a[aria-current=page]{color:#fbbf24;border-color:#f59e0b}
.hero{background:#1e293b;padding:66px 0 60px;border-bottom:4px solid #f59e0b;color:#fff}.eyebrow{color:#fbbf24;font-size:.76rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.hero h1{max-width:900px;color:#fff;font-size:clamp(2rem,4vw,3.35rem);line-height:1.14;margin:.75rem 0 1rem;font-weight:800}.hero p{max-width:800px;color:#cbd5e1;font-size:1.08rem;margin:0}
.category-nav{display:flex;gap:.7rem;flex-wrap:wrap;padding:26px 0;border-bottom:1px solid #e2e8f0}.category-nav a{border:1px solid #cbd5e1;border-radius:7px;padding:.58rem .95rem;color:#334155;background:#fff;font-size:.9rem;font-weight:700;transition:background .18s,border-color .18s,color .18s}.category-nav a:hover{background:#0f172a;border-color:#0f172a;color:#fff}
.catalog-section{padding:46px 0 8px;scroll-margin-top:100px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid #e2e8f0}.section-heading h2{font-size:1.7rem;line-height:1.2;color:#0f172a;margin:0;font-weight:800}.section-heading p{color:#64748b;margin:.45rem 0 0;max-width:760px}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.equipment-card{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0;box-shadow:0 4px 14px rgba(15,23,42,.07);transition:transform .2s,box-shadow .2s,border-color .2s}.equipment-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(15,23,42,.12);border-color:#cbd5e1}
.equipment-image{display:flex;align-items:center;justify-content:center;background:#f1f5f9;aspect-ratio:4/3;overflow:hidden;padding:12px}.equipment-image img{width:100%;height:100%;object-fit:contain;display:block}.card-body{padding:20px 21px 22px;display:flex;flex-direction:column;flex:1}.category-label{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#b7791f}.equipment-card h3{font-size:1.12rem;line-height:1.35;color:#1e293b;margin:.5rem 0 .65rem;font-weight:800}.equipment-card p{font-size:.9rem;line-height:1.65;color:#64748b;margin:0 0 1.15rem}
.card-actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:auto;padding-top:1rem;border-top:1px solid #f1f5f9;font-size:.84rem;font-weight:800}.details-link,.quote-link{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:.58rem .85rem;transition:background .18s,color .18s}.details-link{background:#1e293b;color:#fff}.details-link:hover{background:#334155}.quote-link{background:#f59e0b;color:#111827}.quote-link:hover{background:#fbbf24}
.solution-section{margin:52px 0 12px;padding:30px;background:#fff;border:1px solid #e2e8f0;border-left:4px solid #f59e0b;border-radius:10px;box-shadow:0 4px 14px rgba(15,23,42,.05)}.solution-section h2{color:#0f172a;margin:0 0 .5rem;font-size:1.4rem}.solution-section p{color:#64748b;margin:.3rem 0 1rem}.solution-link{font-weight:800;color:#334155}.solution-link:hover{color:#b7791f}
.cta{margin:50px 0 68px;padding:36px;background:#0f172a;color:#fff;border-bottom:4px solid #f59e0b;border-radius:10px}.cta h2{margin:0 0 .4rem;font-size:1.6rem;font-weight:800}.cta p{color:#cbd5e1;margin:.2rem 0 1.3rem;max-width:800px}.cta a{display:inline-block;background:#f59e0b;color:#111827;border-radius:6px;padding:.72rem 1.1rem;font-weight:800}.cta a:hover{background:#fbbf24}footer{background:#0f172a;border-top:1px solid #334155;padding:26px 0;color:#cbd5e1;font-size:.84rem}
html[dir=rtl] body{text-align:right}html[dir=rtl] .solution-section{border-left:1px solid #e2e8f0;border-right:4px solid #f59e0b}
@media(max-width:900px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}}@media(max-width:760px){.header-inner{align-items:flex-start;flex-direction:column;padding:13px 0;gap:10px}.header-navigation{width:100%;justify-content:space-between;gap:12px}.primary-nav{gap:12px;flex-wrap:wrap;font-size:.82rem}.header-navigation .language-links{gap:10px}}@media(max-width:600px){.header-inner,.container{width:min(1280px,calc(100% - 32px))}.header-inner{min-height:68px;gap:12px;flex-wrap:wrap;padding:12px 0}.language-links{gap:.7rem}.hero{padding:46px 0}.product-grid{grid-template-columns:1fr;gap:18px}.section-heading{display:block}.catalog-section{padding-top:34px}.category-nav{gap:.5rem;padding:18px 0}.category-nav a{font-size:.82rem}.cta{padding:25px}.solution-section{padding:22px}}
</style>
</head>
<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="{{HOME_URL}}/">AIZGZ <span>MACHINERY</span></a><div class="header-navigation">{{PRIMARY_NAV}}<nav class="language-links" aria-label="Languages">{{LANGUAGE_LINKS}}</nav></div></div></header>
  <section class="hero"><div class="container"><div class="eyebrow">{{EYEBROW}}</div><h1>{{HERO_TITLE}}</h1><p>{{HERO_DESCRIPTION}}</p></div></section>
  <main class="container">
    <nav class="category-nav" aria-label="Equipment categories">{{CATEGORY_NAV}}</nav>
    {{CATEGORY_SECTIONS}}
    {{PROVISIONAL_SECTION}}
    {{SOLUTION_SECTION}}
    <section class="cta"><h2>{{CTA_TITLE}}</h2><p>{{CTA_DESCRIPTION}}</p><a href="{{CTA_URL}}">{{CTA_LABEL}}</a></section>
  </main>
  <footer><div class="container">{{FOOTER}}</div></footer>
</body>
</html>
